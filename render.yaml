# Render blueprint for the hardened RetailOps package.
# The SAME Docker image is used locally and on Render. Secrets use sync:false.
databases:
  - name: retailops-db
    plan: basic-256mb
    postgresMajorVersion: "16"

services:
  - type: web
    name: retailops
    runtime: docker
    plan: starter
    dockerfilePath: backend/app/retailops/deploy/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: RETAILOPS_DATABASE_URL
        fromDatabase:
          name: retailops-db
          property: connectionString
      - key: RETAILOPS_EMBED_BACKEND
        value: fastembed
      - key: HF_HUB_DISABLE_XET
        value: "1"
      # OpenAI chat (set OPENAI_API_KEY in Dashboard — never commit).
      - key: RETAILOPS_LLM_PROVIDER
        value: openai
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: RETAILOPS_LLM_MODEL
        value: gpt-4o-mini
      - key: OPENAI_API_KEY
        sync: false
      # Optional: Ollama Cloud as alternate OpenAI-compatible backend.
      - key: OLLAMA_API_KEY
        sync: false
      # Azure OpenAI remains optional.
      - key: AZURE_OPENAI_ENDPOINT
        sync: false
      - key: AZURE_OPENAI_API_KEY
        sync: false
      - key: AZURE_OPENAI_API_VERSION
        sync: false
      - key: AZURE_OPENAI_DEPLOYMENT
        sync: false
      - key: AZURE_OPENAI_EMBEDDING_DEPLOYMENT
        sync: false
